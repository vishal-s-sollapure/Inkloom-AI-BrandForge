# Netlify Configuration for BrandForge (Round 3)

[build]
  # Publish the root directory where index.html, styles.css, and app.js live
  publish = "."
  # Functions directory for secure serverless API endpoints
  functions = "netlify/functions"
  # No frontend build command needed for Vanilla HTML5/CSS/JS runtime
  command = ""

[build.environment]
  # Disable secrets scanning and omit public client keys so builds deploy cleanly
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,GEMINI_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "docs/**,tests/**,.env.example"

# API route rewrites to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
